name: windows-installer

# Manual Windows installer for this fork.
# GitHub -> Actions -> windows-installer -> Run workflow.
# Choose the branch, then download the uploaded *-setup.exe artifact.
# The build is unsigned and does not create updater artifacts, so it does not
# need TAURI_SIGNING_PRIVATE_KEY and it does not publish a GitHub Release.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: windows-nsis
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: install rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable action
        with:
          toolchain: 1.96.0

      - name: cache rust dependencies
        uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: verify version consistency
        run: pnpm run check:versions

      - name: build unsigned Windows installer
        shell: bash
        run: |
          pnpm tauri build \
            --ci \
            --no-sign \
            --config '{"bundle":{"createUpdaterArtifacts":false}}' \
            --bundles nsis

      - name: upload Windows installer
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: Dvoyna-Vault-windows-setup
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
